    <meta

      content="Eugene Owino is a Toronto-based staff software engineer building AI evaluation systems and fintech platforms for regulated financial services."

      rel="stylesheet"
    />

    <script>
      // Apply the saved or preferred theme before first paint to avoid a flash.
      (function () {
        var theme = 'dark';
        try {
          var saved = localStorage.getItem('eo-theme');
          // Dark is always the default; light only when the visitor chose it with the toggle.
          if (saved === 'light' || saved === 'dark') theme = saved;
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.setAttribute('data-bs-theme', theme);
      })();
    </script>
  </head>
